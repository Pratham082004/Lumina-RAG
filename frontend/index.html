<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0f" />
    
    <!-- SEO Meta Tags -->
    <title>Lumina RAG | AI Financial Analysis</title>
    <meta name="description" content="Ask your 10-Ks anything. Lumina RAG processes SEC filings in milliseconds to give you grounded, cited answers and live financial charts." />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Lumina RAG | AI Financial Analysis" />
    <meta property="og:description" content="Query thousands of SEC filings instantly with state-of-the-art vector search and data grounding." />
    <meta property="og:type" content="website" />
    
    <!-- Preconnect to Google Fonts for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body style="background-color: #090a0f; margin: 0;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <div id="root">
      <!-- Premium Initial Loading Screen (shown before React mounts) -->
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 1rem; font-family: system-ui, sans-serif;">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #2fe6c3, #f59e0b); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.25rem; color: #04241d; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">L</div>
        <div style="width: 20px; height: 20px; border: 2px solid rgba(47, 230, 195, 0.2); border-top-color: #2fe6c3; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      </div>
      <style>
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.95); } }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
