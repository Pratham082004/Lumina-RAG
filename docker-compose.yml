version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: financial_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d financial_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/financial_rag
      JWT_SECRET: super_secret_jwt_key
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: financial_rag
      DB_USER: user
      DB_PASSWORD: password
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/financial_rag
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_AUTH_URL: http://localhost:4000
    ports:
      - "80:80"
    depends_on:
      - backend
      - auth-service

volumes:
  postgres_data:
